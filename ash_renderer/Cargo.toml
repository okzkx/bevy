[package]
name = "ash_renderer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# 自研 ash Vulkan 渲染器（lib）+ 宿主壳（bin）。
# 落位决策与施工记录：.agent/docs/2-宿主壳/
# bevy 用默认 feature，对齐 step1《DefaultPlugins分类》"默认 feature 下 34 条插件"的审计口径；
# 渲染族插件在运行时 disable（step2 施工项②，实测后再评估是否收窄 feature 面）。
[dependencies]
bevy = { path = ".." }
ash = "0.38.0"
# bevy 依赖 rwh 0.6 但未再出口，读 RawHandleWrapper 里的 Win32 句柄需要它
raw-window-handle = "0.6"
# 类型化错误：帧循环要对 ERROR_OUT_OF_DATE_KHR 做"重建重试"分支，String 无法 match
thiserror = "2"
