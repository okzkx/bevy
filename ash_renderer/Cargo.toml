[package]
name = "ash_renderer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# 自研 ash Vulkan 渲染器（lib）+ 宿主壳（bin）。设计资料：.agents/docs/开发步骤/2-宿主壳/
# bevy 用默认 feature，渲染族插件在运行时 disable。额外 feature：
# - debug：ComponentInfo::name()/DebugName 给实名，组件全清单展示依赖它；只影响类型名字符串。
# - bevy_remote：BRP 远程直控通道（宿主再补场景语义自定义方法，见 src/remote/）。
# - file_watcher：热重载的自动通道，监听 assets 目录，文件变更 → AssetServer 重载 →
#   AssetEvent；feature 开启即默认监听。
# - jpeg：默认只开 png/hdr。坑：缺它时 loader 按 invalid image extension 拒载 .jpg，
#   材质贴图槽挂着永不到货的 Handle，画面静默回退（如 Sponza 69 张全 jpg）。
[[bin]]
name = "ash_renderer"
path = "src/main.rs"

[dependencies]
bevy = { path = "..", features = ["debug", "bevy_remote", "file_watcher", "jpeg"] }
ash = "0.38.0"
# BRP 自定义方法的 params/响应都走 serde_json::Value（bevy_remote 同款形状）
serde_json = "1.0.140"
# 请求参数结构体反序列化（#[derive(Deserialize)] + #[serde(default)]）
serde = { version = "1", features = ["derive"] }
# bevy 依赖 rwh 0.6 但未再出口，读 RawHandleWrapper 里的 Win32 句柄需要它
raw-window-handle = "0.6"
# 类型化错误：帧循环要对 ERROR_OUT_OF_DATE_KHR 做"重建重试"分支，String 无法 match
thiserror = "2"
# bevy_image 的 TextureFormat/TextureDimension/Extent3d 真身（bevy_image 私有 use
# 不再出口；图像映射按格式名核对 sRGB/线性角色），版本对齐 lock
wgpu-types = { version = "30.0.1", default-features = false }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# #[system] 透明标注：具名系统函数的阅读路标 + 编译期校验（不能带 self），零运行时成本
ash_macros = { path = "../ash_macros" }
# BCn 块压缩编码（BC1~BC5，纯 Rust，libsquish 血统）：显存纹理烘焙用；rayon 并行整图压缩
texpresso = { version = "2.0.2", features = ["rayon"] }

# 进程/系统内存读数（Windows 专用）：GetProcessMemoryInfo + GlobalMemoryStatusEx，按
# 最小 feature 面声明（Foundation = HANDLE、Threading = GetCurrentProcess）。版本对齐
# lock（bevy 传递依赖已带 0.62）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# WGSL → SPIR-V 编译：精确锁版锁行为，lock 内已有 30.0.1（wgpu 传递依赖），features
# 恰为 wgsl-in/spv-out 两个方向。build-dependencies = 正式路径（build.rs 编译
# shaders/*.wgsl）；dev-dependencies = bindless_probe 的内联编译（探针保持自含）。
[build-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
